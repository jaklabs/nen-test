name: CI

# Useful with zero tests: compiles every file and imports every module, which
# catches a syntax error or a broken import before it reaches production.
# Gets stronger as tests appear — it runs them automatically once they exist.
on:
  push: { branches: [main, master] }
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install dependencies if declared
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f pyproject.toml ] && pip install -e . || true

      - name: Every file compiles
        run: python -m compileall -q .

      - name: Run tests if any exist
        run: |
          if ls tests/test_*.py test_*.py >/dev/null 2>&1; then
            python -m pytest -q 2>/dev/null || \
              for t in tests/test_*.py test_*.py; do [ -f "$t" ] && python "$t"; done
          else
            echo 'no tests yet — compile check passed'
          fi
